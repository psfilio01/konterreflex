project_id = "konterreflex"

[api]
enabled = true
port = 55421
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55422
shadow_port = 55420
major_version = 17

[studio]
enabled = true
port = 55423

[inbucket]
enabled = true
port = 55424
smtp_port = 55425
pop3_port = 55426

[analytics]
enabled = true
port = 55427
backend = "postgres"

[auth]
enabled = true
site_url = "konterreflex://login-callback"
additional_redirect_urls = ["konterreflex://login-callback", "http://localhost:3000/**"]
jwt_expiry = 3600

[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 8
otp_expiry = 3600

[auth.email.template.magic_link]
subject = "Dein Anmeldecode für Konterreflex"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.confirmation]
subject = "Dein Anmeldecode für Konterreflex"
content_path = "./supabase/templates/confirmation.html"

[functions.ai-gateway]
enabled = true
verify_jwt = true
static_files = ["./prompts/*.md"]

[functions.speech-gateway]
enabled = true
verify_jwt = true

[functions.create-checkout-session]
enabled = true
verify_jwt = true

[functions.create-customer-portal]
enabled = true
verify_jwt = true

[functions.stripe-webhook]
enabled = true
verify_jwt = false
